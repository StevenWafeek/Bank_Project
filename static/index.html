<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIeBank — Sign in</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="auth-page">
  <header class="navbar">
    <a href="/" class="brand"><span class="logo">M</span>MIeBank</a>
    <nav><a href="/about.html">About</a></nav>
  </header>

  <main class="auth-wrapper">
    <section class="auth-hero">
      <h1>Banking made <span class="accent">simple</span>.</h1>
      <p>Check your balance, deposit and withdraw money securely — anytime, anywhere with MIeBank.</p>
      <ul class="features">
        <li>Secure, encrypted passwords</li>
        <li>Instant deposits &amp; withdrawals</li>
        <li>Full transaction history</li>
      </ul>
    </section>

    <section class="card auth-card">
      <div class="tabs" role="tablist">
        <button class="tab active" data-tab="login" role="tab">Log in</button>
        <button class="tab" data-tab="signup" role="tab">Sign up</button>
      </div>

      <form id="login-form" class="form" novalidate>
        <h2>Welcome back</h2>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Password
          <input type="password" name="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="btn btn-primary">Log in</button>
      </form>

      <form id="signup-form" class="form hidden" novalidate>
        <h2>Open your account</h2>
        <label>Full name
          <input type="text" name="name" autocomplete="name" minlength="2" maxlength="60" required>
        </label>
        <label>Email
          <input type="email" name="email" autocomplete="email" required>
        </label>
        <label>Password <small>(min. 8 characters)</small>
          <input type="password" name="password" autocomplete="new-password" minlength="8" maxlength="72" required>
        </label>
        <label>Confirm password
          <input type="password" name="confirm" autocomplete="new-password" required>
        </label>
        <button type="submit" class="btn btn-primary">Create account</button>
      </form>

      <p id="auth-message" class="message" role="alert"></p>
    </section>
  </main>

  <footer class="footer">&copy; <span id="year"></span> MIeBank. All rights reserved.</footer>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
