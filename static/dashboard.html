<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MIeBank — Dashboard</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="navbar">
    <a href="/dashboard.html" class="brand"><span class="logo">M</span>MIeBank</a>
    <nav>
      <a href="/dashboard.html" class="active">Dashboard</a>
      <a href="/about.html">About</a>
      <button id="logout-btn" class="btn btn-ghost">Log out</button>
    </nav>
  </header>

  <main class="container">
    <section class="welcome">
      <h1>Hello, <span id="user-name">…</span></h1>
      <p class="muted">Account <strong id="account-number">…</strong></p>
    </section>

    <section class="options">
      <button class="option active" data-panel="balance">
        <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="2"/><path d="M2 10h20"/><circle cx="16" cy="15" r="1.5"/></svg>
        <span>Your Balance</span>
      </button>
      <button class="option" data-panel="withdraw">
        <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
        <span>Withdraw</span>
      </button>
      <button class="option" data-panel="deposit">
        <svg class="option-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M19 12l-7 7-7-7"/></svg>
        <span>Deposit</span>
      </button>
    </section>

    <section class="card panel" id="panel-balance">
      <h2>Your Balance</h2>
      <p class="balance" id="balance-amount">$0.00</p>
      <p class="muted">Available balance</p>
    </section>

    <section class="card panel hidden" id="panel-withdraw">
      <h2>Withdraw</h2>
      <p class="muted">Available: <strong class="balance-inline">$0.00</strong></p>
      <form id="withdraw-form" class="form inline-form" novalidate>
        <label>Amount (USD) <small>(whole dollars, min. $20)</small>
          <input type="number" name="amount" min="20" step="1" inputmode="numeric" placeholder="20" required>
        </label>
        <div class="quick-amounts">
          <button type="button" data-amount="20">$20</button>
          <button type="button" data-amount="50">$50</button>
          <button type="button" data-amount="100">$100</button>
          <button type="button" data-amount="500">$500</button>
        </div>
        <button type="submit" class="btn btn-danger">Withdraw</button>
      </form>
    </section>

    <section class="card panel hidden" id="panel-deposit">
      <h2>Deposit</h2>
      <p class="muted">Current balance: <strong class="balance-inline">$0.00</strong></p>
      <form id="deposit-form" class="form inline-form" novalidate>
        <label>Amount (USD) <small>(whole dollars, min. $20)</small>
          <input type="number" name="amount" min="20" step="1" inputmode="numeric" placeholder="20" required>
        </label>
        <div class="quick-amounts">
          <button type="button" data-amount="20">$20</button>
          <button type="button" data-amount="50">$50</button>
          <button type="button" data-amount="100">$100</button>
          <button type="button" data-amount="500">$500</button>
        </div>
        <button type="submit" class="btn btn-success">Deposit</button>
      </form>
    </section>

    <p id="dash-message" class="message" role="alert"></p>

    <section class="card">
      <h2>Recent transactions</h2>
      <div class="table-wrap">
      <table class="tx-table">
        <thead>
          <tr><th>Date</th><th>Type</th><th class="num">Amount</th><th class="num">Balance</th></tr>
        </thead>
        <tbody id="tx-body">
          <tr><td colspan="4" class="muted center">No transactions yet.</td></tr>
        </tbody>
      </table>
      </div>
    </section>
  </main>

  <footer class="footer">&copy; <span id="year"></span> MIeBank. All rights reserved.</footer>

  <script src="/js/api.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
